<div id="task-list">
  <h2>Tasks</h2>
  {% for task in tasks %}
  <div id="task-{{ task.id }}" data-task-id="{{ task.id}}" class="task-item">
    <h3>{{ task.name }}</h3>
    <p>{{ task.description }}</p>
    <button>Delete</button>
    <button>Complete</button>
    <button>Edit</button>
  </div>
  {% endfor %}
</div>
