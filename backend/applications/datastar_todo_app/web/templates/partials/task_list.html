<div id="task-list">
  <h2>Tasks</h2>
  <div id="tasks-container">
    {% for task in tasks %}
    <div id="task-{{ task.id }}" class="task-item">
      <h3>{{ task.name }}</h3>
      <p>{{ task.description }}</p>
      <button data-on:click="@delete('/tasks/fragments/{{ task.id }}')">
        Delete
      </button>
      <button>Complete</button>
      <button>Edit</button>
    </div>
    {% endfor %}
  </div>
</div>
