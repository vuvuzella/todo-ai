[project]
name = "todo-app-backend"
version = "0.1.0"
description = "A todo app that uses the FERN stack"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "snowflake-id-toolkit>=0.6.0",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.41.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# based pyright config https://docs.basedpyright.com/v1.20.0/configuration/config-files/
[tool.basedpyright]
include = ["applications/api"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportPrivateLocalImportUsage = false
reportUnannotatedClassAttribute = false
reportUnusedCallResult = false

pythonVersion = "3.13.7"
pythonPlatform = "Linux"

[dependency-groups]
dev = [
    "ptpython>=3.0.32",
    # "git-cliff>=2.11.0",
    # "jupyter>=1.1.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.1",
    "tumult>=0.1.1",
]

# private repository
[[tool.uv.index]]
name = "codeartifact"
url = "https://vuvuzella-441203120777.d.codeartifact.ap-southeast-2.amazonaws.com/pypi/privy_weepo/simple"
publish-url = "https://vuvuzella-441203120777.d.codeartifact.ap-southeast-2.amazonaws.com/pypi/privy_weepo/"
explicit = true

[tool.uv.sources]
tumult = { index = "codeartifact" }

[tool.hatch.build.targets.wheel]
packages = ["applications", "domain", "infrastructure"]

[project.scripts]
api = "applications.api.app:start"
