[project]
name = "todo-app-backend"
version = "0.1.0"
description = "A todo app that uses the FERN stack"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "auth0-fastapi>=1.0.0b10",
    "auth0-fastapi-api>=1.0.0b8",
    "fastapi>=0.135.1",
    "fastapi-cors>=0.0.6",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.12.5",
    "pydantic-config>=0.4.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "snowflake-id-toolkit>=0.6.0",
    "snowflakekit>=0.1.1",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.41.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# based pyright config https://docs.basedpyright.com/v1.20.0/configuration/config-files/
[tool.basedpyright]
include = ["applications/api"]
exclude = ["**/node_modules", "**/__pycache__"]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportPrivateLocalImportUsage = false
reportUnannotatedClassAttribute = false
reportUnusedCallResult = false

pythonVersion = "3.13.7"
pythonPlatform = "Linux"

[dependency-groups]
api = ["snowflake-id-toolkit>=0.6.0", "sqlmodel>=0.0.38"]
datastar-todo-app = ["jinja2>=3.1.6"]
dev = [
    "alembic>=1.18.5",
    "ptpython>=3.0.32",
    # "git-cliff>=2.11.0",
    # "jupyter>=1.1.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.1",
    # "tumult>=0.1.1",
]

# private repository
# [[tool.uv.index]]
# name = "codeartifact"
# url = "https://vuvuzella-441203120777.d.codeartifact.ap-southeast-2.amazonaws.com/pypi/privy_weepo/simple"
# publish-url = "https://vuvuzella-441203120777.d.codeartifact.ap-southeast-2.amazonaws.com/pypi/privy_weepo/"
# explicit = true

[tool.uv.sources]
tumult = { index = "codeartifact" }

[tool.hatch.build.targets.wheel]
packages = ["applications", "domain", "infrastructure"]

[project.scripts]
api = "applications.api.app:start"
datastar-todo = "applications.datastar_todo_app.app:start"

[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/infrastructure/migrations/alembic"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = ["."]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
version_locations = [
    "%(here)s/infrastructure/migrations/alembic/versions",
    #    "%(here)s/foo/bar"
]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = [
    "TC004", # Ignore using imports for type checking
    "B008"  # Ignore calling Depends as parameter defaults in endpoint handlers
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
